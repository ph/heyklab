---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: longhorn-helm
  namespace: default
  annotations:
    "helmcharts.cattle.io/managed-by": helm-controller
  finalizers:
    - wrangler.cattle.io/on-helm-chart-remove
spec:
  version: v1.11.0
  chart: longhorn
  repo: https://charts.longhorn.io
  failurePolicy: abort
  targetNamespace: longhorn-system
  createNamespace: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: longhorn-gateway
  namespace: longhorn-system
spec:
  addresses:
    - type: IPAddress
      value: 10.10.20.12
  gatewayClassName: cilium
  listeners:
  - allowedRoutes:
      namespaces:
        from: Same
    name: longhorn-gw
    port: 443
    protocol: HTTPS
    hostname: "longhorn.local.heyk.org"
    tls:
      certificateRefs:
      - kind: Secret
        name: longhorn-local-heyk-org
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longorn-httproute
  namespace: longhorn-system
spec:
  parentRefs:
  - name: longhorn-gateway
  hostnames:
  - "longhorn.local.heyk.org"
  rules:
  - backendRefs:
    - name: longhorn-frontend
      port: 80
---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn-local-volume
provisioner: driver.longhorn.io
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "1"
  dataLocality: "strict-local"
  reclaimPolicy: Retain
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: longhorn-local-heyk-org
  namespace: default
spec:
  secretName: longhorn-local-heyk-org
  issuerRef:
    name: letsencrypt-issuer
    kind: ClusterIssuer
  dnsNames:
  - "longhorn.local.heyk.org"
