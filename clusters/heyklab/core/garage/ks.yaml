# move into garage namespace
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: git-garage
  namespace: default
spec:
  interval: 5m
  url: https://git.deuxfleurs.fr/Deuxfleurs/garage
  ref:
    branch: main-v2
  sparseCheckout:
    - script/helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
  namespace: default
spec:
  interval: 10m
  chart:
    spec:
      chart: ./script/helm/garage
      version: 0.9.2
      interval: 10m
      sourceRef:
        kind: GitRepository
        name: git-garage
        namespace: default
  values:
    garage:
      replicationFactor: 2

    deployment:
      replicaCount: 3

    persistence:
      meta:
        storageClass: "longhorn-local-volume"
        size: 100Mi
      data:
        storageClass: "longhorn-local-volume"
        size: 10Gi
    ingress:
      enable: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garage
  namespace: default
  annotations:
    kubernetes.io/ingress.class: cilium
spec:
  rules:
  - host: garage.local.heyk.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: garage
            port:
              number: 3900
