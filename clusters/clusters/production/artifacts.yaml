---
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: flux-system
  namespace: flux-system
spec:
  sources:
    - alias: monorepo
      kind: GitRepository
      name: flux-system
  artifacts:
    - name: secrets
      originRevision: "@monorepo"
      copy:
        - from: "@monorepo/clusters/secrets/production/**"
          to: "@artifact/secrets/"
    - name: infrastructure
      originRevision: "@monorepo"
      copy:
        - from: "@monorepo/clusters/infrastructure/**"
          to: "@artifact/"
    - name: apps
      originRevision: "@monorepo"
      copy:
        - from: "@monorepo/clusters/apps/base/**"
          to: "@artifact/base/"
        - from: "@monorepo/clusters/apps/production/**"
          to: "@artifact/apps/"
