---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
spec:
  interval: 5m
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    branch: v1.4.1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: gateway-api
  path: "./config/crd/"
  prune: true
  timeout: 1m
---
