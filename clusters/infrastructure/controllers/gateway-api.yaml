---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: default
spec:
  interval: 1h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    semver: ">=1.4.1 <1.5.0"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: default
spec:
  wait: true
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: gateway-api
    namespace: default
  path: "./config/crd/"
  prune: true
  timeout: 5m
---
