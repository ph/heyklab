---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 1m
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 10m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  chart:
    spec:
      chart: k8s-monitoring
      version: '3.8'
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 10m
  values:
    cluster:
      name: heyklab
    destinations:
      # - name: prometheus
      #   type: prometheus
      #   url: http://prometheus.prometheus.svc:9090/api/v1/write
      - name: loki
        type: loki
        url: http://loki-gateway.loki.svc.cluster.local:3100/loki/api/v1/push
    podLogs:
      enabled: true
    # alloy-metrics:
    #   enabled: true
    alloy-logs:
      enabled: true
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 5m0s
  url:  oci://ghcr.io/grafana-community/helm-charts/grafana
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    semver: "^11.1.8"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 12h
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  chartRef:
    kind: OCIRepository
    name: grafana
    namespace: flux-system
  values:
    adminUser: admin
    adminPassword: abc123
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-local-heyk-org-cert
  namespace: monitoring
spec:
  secretName: grafana-local-heyk-org-cert
  issuerRef:
    name: letsencrypt-issuer
    kind: ClusterIssuer
  dnsNames:
  - grafana.local.heyk.org
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: grafana-gateway
  namespace: monitoring
spec:
  infrastructure:
    annotations:
      io.cilium/lb-ipam-ips: 10.10.20.20
  gatewayClassName: cilium
  listeners:
  - allowedRoutes:
      namespaces:
        from: Same
    name: web-gw
    port: 443
    protocol: HTTPS
    hostname: "grafana.local.heyk.org"
    tls:
      certificateRefs:
        - kind: Secret
          name: grafana-local-heyk-org-cert
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-httproute
  namespace: monitoring
spec:
  parentRefs:
  - name: grafana-gateway
  hostnames:
  - "grafana.local.heyk.org"
  rules:
  - backendRefs:
    - name: grafana
      port: 80
