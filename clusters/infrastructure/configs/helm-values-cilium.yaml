---
encryption:
  enabled: true
  type: "wireguard"
  # This doesn't work on control-plane, there are excluded by default.
  nodeEncryption: true
crds:
  install: true
bgpControlPlane:
  enabled: true
k8sServiceHost: "127.0.0.1"
k8sServicePort: 6443
kubeProxyReplacement: true
gatewayAPI:
  enabled: true
envoy:
  enabled: true
routingMode: "native"
ipv4NativeRoutingCIDR: "10.42.0.0/16"
autoDirectNodeRoutes: true
ipam:
  mode: "kubernetes"
  operator:
    clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]
operator:
  replicas: 3
