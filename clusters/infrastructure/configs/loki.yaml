apiVersion: garage.rajsingh.info/v1alpha1
kind: GarageBucket
metadata:
  name: loki
  namespace: loki-chunk
spec:
  clusterRef:
    name: garage
  quotas:
    maxSize: 10Gi
---
kind: GarageBucket
metadata:
  name: loki
  namespace: loki-ruler
spec:
  clusterRef:
    name: garage
  quotas:
    maxSize: 2Gi
---
kind: GarageBucket
metadata:
  name: loki
  namespace: loki-admin
spec:
  clusterRef:
    name: garage
  quotas:
    maxSize: 2Gi
---
apiVersion: garage.rajsingh.info/v1alpha1
kind: GarageKey
metadata:
  name: loki-access
  namespace: loki
spec:
  clusterRef:
    name: garage
  bucketPermissions:
    - bucketRef: loki-chunk
      read: true
      write: true
    - bucketRef: loki-ruler
      read: true
      write: true
    - bucketRef: loki-admin
      read: true
      write: true
---
apiVersion: v1
kind: Namespace
metadata:
  name: loki
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 1m
  url: https://grafana.github.io/helm-charts
