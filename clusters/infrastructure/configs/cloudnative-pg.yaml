---
apiVersion: v1
kind: Namespace
metadata:
  name: pg
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: pg
spec:
  instances: 3
  storage:
    storageClass: longhorn-local-volume
    size: 5Gi
  bootstrap:
    initdb:
      database: grafana
      owner: grafana
  managed:
    roles:
      - name: grafana
        ensure: present
        login: true
        createdb: false
        passwordSecret:
          name: database-grafana-password
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: database-grafana
  namespace: pg
spec:
  name: grafana
  owner: grafana
  cluster:
    name: pg
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: grafana-gateway
  namespace: monitoring
spec:
  addresses:
    - type: IPAddress
      value: 10.10.20.19
  gatewayClassName: cilium
  listeners:
  - allowedRoutes:
      namespaces:
        from: Same
    name: grafana-gw
    port: 443
    protocol: HTTPS
    hostname: "grafana.local.heyk.org"
    tls:
      certificateRefs:
      - kind: Secret
        name: grafana-local-heyk-org
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-httproute
  namespace: monitoring
spec:
  parentRefs:
  - name: grafana-gateway
  hostnames:
  - "grafana.local.heyk.org"
  rules:
  - backendRefs:
    - name: grafana-service
      port: 3000
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-local-heyk-org
  namespace: monitoring
spec:
  secretName: grafana-local-heyk-org
  issuerRef:
    name: letsencrypt-issuer
    kind: ClusterIssuer
  dnsNames:
  - "grafana.local.heyk.org"
