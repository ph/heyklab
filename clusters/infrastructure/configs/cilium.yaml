---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 5m0s
  url: https://helm.cilium.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 10m
  chart:
    spec:
      chart: cilium
      version: '1.19.0'
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: helm-values-cilium
  dependsOn:
    - name: gateway-api-crds
      namespace: flux-system
---
