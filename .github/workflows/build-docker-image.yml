name: Build and Push docker image
on:
  push:
    branches:
    - main
  workflow_dispatch:
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Check Nix flake
      uses: DeterminateSystems/flake-checker-action@main

    - name: Install Nix
      uses: DeterminateSystems/determinate-nix-action@main

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to GHCR
      uses: docker/login-action@v2
      with:
       registry: ghcr.io
       username: ${{ github.repository_owner }}
       password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      run: |
        nix build .#blockyDns
        docker load < result

    - name: Collection nix sha from the docker image and save it in the environment.
      run: |
        TAG=$(nix eval .#blockyDns.imageTag)
        echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

    - name: Rename image to match Google Docker registry
      run: |
        docker tag blocky-dns:$IMAGE_TAG ghcr.io/${{github.repository}}/blocky-dns:latest
        docker tag blocky-dns:$IMAGE_TAG ghcr.io/${{github.repository}}/blocky-dns:$IMAGE_TAG

    - name: Push Docker image
      run: |
        docker push ghcr.io/${{github.repository}}/blocky-dns:latest
        docker push ghcr.io/${{github.repository}}/blocky-dns:$IMAGE_TAG


