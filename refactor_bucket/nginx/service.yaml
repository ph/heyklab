apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nginx-local-heyk-org-cert
  namespace: nginx
spec:
  secretName: nginx-local-heyk-org-cert
  issuerRef:
    name: letsencrypt-issuer
    kind: ClusterIssuer
  dnsNames:
  - nginx.local.heyk.org
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: local-nginx-gateway
  namespace: nginx
spec:
  infrastructure:
    annotations:
      io.cilium/lb-ipam-ips: 10.10.20.11
  gatewayClassName: cilium
  listeners:
  - allowedRoutes:
      namespaces:
        from: Same
    name: web-gw
    port: 443
    protocol: HTTPS
    hostname: "nginx.local.heyk.org"
    tls:
      certificateRefs:
        - kind: Secret
          name: nginx-local-heyk-org-cert
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: local-nginx-httproute
  namespace: nginx
spec:
  parentRefs:
  - name: local-nginx-gateway
  hostnames:
  - "nginx.local.heyk.org"
  rules:
  - backendRefs:
    - name: nginx
      port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: nginx
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
